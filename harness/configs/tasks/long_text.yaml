- id: lt_001
  category: long_text
  prompt: '请撰写一份「受限环境下的 harness 侧纠错机制技术方案」，文体为技术方案。要求：

    1. 正文不少于 2000 字，使用 Markdown 组织为 7 个编号章节；

    2. 每个章节都要给出可执行的具体结论，不要停留在原则性表述；

    3. 明确写出适用范围、边界条件与失败处理方式；

    4. 不允许把任何段落标为待补充，交付内容必须完整。'
  validation:
    kind: regex
    config:
      pattern: (?s)^(?=.*\#\#\s*1\.)(?=.*\#\#\s*7\.)(?!.*\[\[TBD:lt_001\]\]).{2000,}
      mode: search
  timeout: 300
  expected_error_prone_areas:
  - 未替换的占位符段落
  - 章节编号不连续
  - 正文长度不足
  dangerous_operations: []
  baseline_difficulty: hard
  metadata:
    doc_type: 技术方案
    min_chars: 2000
    sections: 7
    placeholder: '[[TBD:lt_001]]'
