  prompt: '请用 Python 实现「配置合并框架」。要求：

    1. 单文件交付，总行数超过 300 行，包含完整类型注解与 docstring；

    2. 覆盖正常路径、边界条件与异常路径，并显式处理参数非法的情况；

    3. 不依赖任何第三方库，只用标准库；

    4. 输出必须是一个完整的 Markdown 代码块（```python ... ```），块内代码可直接 ast.parse；

    5. 不要输出伪代码，也不要省略任何函数体。


    补充要求：配置合并与校验框架。'
  validation:
    kind: compile
    config:
      language: python
      min_lines: 300
  timeout: 300
  expected_error_prone_areas:
  - 深度合并的数组语义
  - 类型校验失败的报告
  - 敏感字段脱敏
  dangerous_operations: []
  baseline_difficulty: medium
  metadata:
    core_concept: 配置合并框架
    requirement: 配置合并与校验框架
    min_lines: 300
