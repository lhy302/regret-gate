# 任务集：long_code（20 个，由 experiments/generate_tasks.py 生成）
# 标注要求见构建规范 §12.5：expected_error_prone_areas / dangerous_operations / baseline_difficulty 必须齐全。
- id: lc_001
  category: long_code
  prompt: '请用 Python 实现「LRU 缓存」。要求：

    1. 单文件交付，总行数超过 300 行，包含完整类型注解与 docstring；

    2. 覆盖正常路径、边界条件与异常路径，并显式处理参数非法的情况；

    3. 不依赖任何第三方库，只用标准库；

    4. 输出必须是一个完整的 Markdown 代码块（```python ... ```），块内代码可直接 ast.parse；

    5. 不要输出伪代码，也不要省略任何函数体。


    补充要求：支持并发读写的 LRU 缓存。'
  validation:
    kind: compile
    config:
      language: python
      min_lines: 300
  timeout: 300
  expected_error_prone_areas:
  - 淘汰策略的边界（容量为 1）
  - 并发读写的锁粒度
  - 过期时间与容量淘汰的交互
  dangerous_operations: []
  baseline_difficulty: hard
  metadata:
    core_concept: LRU 缓存
    requirement: 支持并发读写的 LRU 缓存
    min_lines: 300
