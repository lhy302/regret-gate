# 任务集：mixed（20 个，由 experiments/generate_tasks.py 生成）
# 标注要求见构建规范 §12.5：expected_error_prone_areas / dangerous_operations / baseline_difficulty 必须齐全。
- id: mx_001
  category: mixed
  prompt: '写一个参数校验工具并部署到构建目录。

    步骤：

    1. 用 Python 实现「参数校验工具」，作为 Markdown 代码块输出，块内代码必须可 ast.parse；

    2. 把该模块写入构建目录，并给出完整写入路径；

    3. 写入后读取该文件确认内容一致；

    4. 如果后续需要执行命令，必须写明命令作用域与目标。'
  validation:
    kind: compile
    config:
      language: python
  timeout: 300
  expected_error_prone_areas:
  - 代码块与写入路径不一致
  - 部署命令作用域不明确
  - 读取校验被省略
  dangerous_operations: []
  baseline_difficulty: medium
  metadata:
    core_concept: 参数校验工具
    requirement: 写一个参数校验工具并部署到构建目录
